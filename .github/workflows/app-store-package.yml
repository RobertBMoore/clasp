name: Mac App Store package (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric App Store version (for example 1.0.0)
        required: true
      build_number:
        description: Strictly increasing integer build number
        required: true
      confirmation:
        description: Type BUILD PACKAGE ONLY
        required: true

permissions:
  contents: read

concurrency:
  # Preserve approved release requests instead of replacing an older pending
  # run when another request enters this protected serial group.
  group: clasp-app-store-package
  cancel-in-progress: false
  queue: max

jobs:
  protected-ref-preflight:
    runs-on: macos-26
    steps:
      - name: Require protected default branch and explicit non-submission confirmation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RAW_VERSION: ${{ inputs.version }}
          RAW_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_REF" == "refs/heads/$DEFAULT_BRANCH" ]] \
            || { echo "App Store packaging must run from the default branch" >&2; exit 1; }
          [[ "$REF_PROTECTED" == true ]] \
            || { echo "App Store packaging requires a protected ref" >&2; exit 1; }
          [[ "$CONFIRMATION" == 'BUILD PACKAGE ONLY' ]] \
            || { echo "App Store packaging confirmation is invalid" >&2; exit 1; }
          [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "App Store version is invalid" >&2; exit 1; }
          [[ "$RAW_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] \
            || { echo "App Store build number is invalid" >&2; exit 1; }

  signed-package:
    needs: protected-ref-preflight
    runs-on: macos-26
    timeout-minutes: 30
    environment:
      name: app-store-release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Require protected-environment configuration
        env:
          PROTECTION_ACKNOWLEDGEMENT: ${{ vars.CLASP_APP_STORE_ENVIRONMENT_PROTECTED }}
          TEAM_ID: ${{ vars.CLASP_APP_STORE_TEAM_ID }}
          APP_ID_PREFIX: ${{ vars.CLASP_APP_STORE_APP_ID_PREFIX }}
          APPLICATION_IDENTITY: ${{ vars.CLASP_APP_STORE_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ vars.CLASP_APP_STORE_INSTALLER_IDENTITY }}
          APPLICATION_CERTIFICATE_SHA256: ${{ vars.CLASP_APP_STORE_APPLICATION_CERTIFICATE_SHA256 }}
          INSTALLER_CERTIFICATE_SHA256: ${{ vars.CLASP_APP_STORE_INSTALLER_CERTIFICATE_SHA256 }}
          PRIVACY_POLICY_URL: ${{ vars.CLASP_PRIVACY_POLICY_URL }}
          LAST_ACCEPTED_BUILD_NUMBER: ${{ vars.CLASP_APP_STORE_LAST_ACCEPTED_BUILD_NUMBER }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$PROTECTION_ACKNOWLEDGEMENT" == 'required-reviewers-configured' ]] \
            || { echo "App Store release environment acknowledgement is invalid" >&2; exit 1; }
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] \
            || { echo "App Store Team ID is invalid" >&2; exit 1; }
          [[ "$APP_ID_PREFIX" =~ ^[A-Z0-9]{10}$ ]] \
            || { echo "App Store application identifier prefix is invalid" >&2; exit 1; }
          [[ "$APPLICATION_IDENTITY" == 'Apple Distribution: '* || "$APPLICATION_IDENTITY" == '3rd Party Mac Developer Application: '* ]] \
            || { echo "App Store application identity is invalid" >&2; exit 1; }
          [[ "$INSTALLER_IDENTITY" == '3rd Party Mac Developer Installer: '* || "$INSTALLER_IDENTITY" == 'Mac Installer Distribution: '* ]] \
            || { echo "App Store installer identity is invalid" >&2; exit 1; }
          [[ "$APPLICATION_CERTIFICATE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] \
            || { echo "App Store application certificate fingerprint is invalid" >&2; exit 1; }
          [[ "$INSTALLER_CERTIFICATE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] \
            || { echo "App Store installer certificate fingerprint is invalid" >&2; exit 1; }
          ./script/lib/validate_public_https_url.sh \
            "$PRIVACY_POLICY_URL" --require-reachable
          [[ "$LAST_ACCEPTED_BUILD_NUMBER" =~ ^(0|[1-9][0-9]{0,17})$ ]] \
            || { echo "last accepted App Store build number is invalid" >&2; exit 1; }
          ((10#$REQUESTED_BUILD_NUMBER > 10#$LAST_ACCEPTED_BUILD_NUMBER)) \
            || { echo "requested App Store build must exceed the last accepted build" >&2; exit 1; }

      - name: Test the exact App Store compilation boundary
        env:
          CLASP_DIRECT_DISTRIBUTION: "0"
        run: |
          set -euo pipefail
          source release/config.env
          [[ ! -e Package.resolved && ! -L Package.resolved ]] \
            || { echo "root Package.resolved must be absent before App Store release tests" >&2; exit 1; }
          swift test \
            --scratch-path .build-app-store-release-test \
            --configuration release \
            --arch "$CLASP_ARCH" \
            -Xswiftc -DCLASP_APP_STORE
          [[ ! -e Package.resolved && ! -L Package.resolved ]] \
            || { echo "root Package.resolved must remain absent after App Store release tests" >&2; exit 1; }

      - name: Import exact App Store identities into an ephemeral keychain
        env:
          APPLICATION_P12: ${{ secrets.CLASP_APP_STORE_APPLICATION_P12_BASE64 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.CLASP_APP_STORE_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.CLASP_APP_STORE_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.CLASP_APP_STORE_INSTALLER_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.CLASP_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$APPLICATION_P12" && -n "$APPLICATION_P12_PASSWORD" ]] \
            || { echo "App Store application credential is missing" >&2; exit 1; }
          [[ -n "$INSTALLER_P12" && -n "$INSTALLER_P12_PASSWORD" ]] \
            || { echo "App Store installer credential is missing" >&2; exit 1; }
          [[ -n "$PROFILE_BASE64" ]] \
            || { echo "App Store provisioning profile is missing" >&2; exit 1; }
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          {
            echo "CLASP_EPHEMERAL_KEYCHAIN=$RUNNER_TEMP/clasp-app-store.keychain-db"
            echo "CLASP_APP_STORE_PROVISIONING_PROFILE=$RUNNER_TEMP/Clasp.provisionprofile"
          } >> "$GITHUB_ENV"
          printf '%s' "$APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/Clasp.provisionprofile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp-app-store.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp-app-store.keychain-db"
          security import "$RUNNER_TEMP/application.p12" -k "$RUNNER_TEMP/clasp-app-store.keychain-db" -P "$APPLICATION_P12_PASSWORD" -A -t cert -f pkcs12
          security import "$RUNNER_TEMP/installer.p12" -k "$RUNNER_TEMP/clasp-app-store.keychain-db" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp-app-store.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/clasp-app-store.keychain-db"

      - name: Build, sign, package, and validate without submitting
        env:
          CLASP_APP_STORE_TEAM_ID: ${{ vars.CLASP_APP_STORE_TEAM_ID }}
          CLASP_APP_STORE_APP_ID_PREFIX: ${{ vars.CLASP_APP_STORE_APP_ID_PREFIX }}
          CLASP_APP_STORE_APPLICATION_IDENTITY: ${{ vars.CLASP_APP_STORE_APPLICATION_IDENTITY }}
          CLASP_APP_STORE_INSTALLER_IDENTITY: ${{ vars.CLASP_APP_STORE_INSTALLER_IDENTITY }}
          CLASP_APP_STORE_APPLICATION_CERTIFICATE_SHA256: ${{ vars.CLASP_APP_STORE_APPLICATION_CERTIFICATE_SHA256 }}
          CLASP_APP_STORE_INSTALLER_CERTIFICATE_SHA256: ${{ vars.CLASP_APP_STORE_INSTALLER_CERTIFICATE_SHA256 }}
          CLASP_PRIVACY_POLICY_URL: ${{ vars.CLASP_PRIVACY_POLICY_URL }}
        run: |
          set -euo pipefail
          ./script/package_app_store.sh \
            --version '${{ inputs.version }}' \
            --build-number '${{ inputs.build_number }}'
          [[ ! -e Package.resolved && ! -L Package.resolved ]] \
            || { echo "App Store packaging left a root Package.resolved" >&2; exit 1; }

      - name: Upload signed package for human review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Clasp-${{ inputs.version }}-${{ inputs.build_number }}-AppStore-review-only
          path: |
            release-output/AppStore/Clasp-${{ inputs.version }}-${{ inputs.build_number }}-AppStore.pkg
            release-output/AppStore/Clasp-${{ inputs.version }}-${{ inputs.build_number }}-AppStore.pkg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove imported release credentials
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CLASP_EPHEMERAL_KEYCHAIN:-}" && -e "$CLASP_EPHEMERAL_KEYCHAIN" ]]; then
            security delete-keychain "$CLASP_EPHEMERAL_KEYCHAIN"
          fi
          rm -f \
            "$RUNNER_TEMP/application.p12" \
            "$RUNNER_TEMP/installer.p12" \
            "$RUNNER_TEMP/Clasp.provisionprofile"

      # Deliberately absent: altool, Transporter, App Store Connect upload,
      # TestFlight submission, release creation, or automatic publishing.

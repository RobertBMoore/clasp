name: Published direct release acceptance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published release tag to recover (for example v1.0.0)
        required: true
      release_id:
        description: Exact numeric GitHub release ID approved for recovery
        required: true
      source_sha:
        description: Exact 40-character commit SHA resolved by the approved tag
        required: true
      archive_sha256:
        description: Approved SHA-256 for the published Clasp archive
        required: true

permissions:
  contents: read

concurrency:
  group: clasp-direct-published-acceptance
  cancel-in-progress: false
  queue: max

jobs:
  verify-public-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # A release event runs the workflow version at its tagged source. Pin
          # that exact workflow SHA, then prove below that both it and the release
          # source remain ancestors of the protected default branch.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-source
      - name: Download and verify the exact public update assets
        env:
          # Release events run from tag refs, which cannot use the protected-
          # branches-only release environment. These four non-secret repository
          # variables use distinct names and must exactly mirror the protected
          # release-environment pins. Distinct names prevent repository values
          # from shadowing environment values in the draft workflow.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}
          APPROVED_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          EXPECTED_TAG_SHA: ${{ github.event_name == 'release' && github.sha || inputs.source_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRIGGER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          UPDATE_FEED_URL: ${{ vars.CLASP_PUBLISHED_UPDATE_FEED_URL }}
          SPARKLE_PUBLIC_KEY: ${{ vars.CLASP_PUBLISHED_SPARKLE_PUBLIC_KEY }}
          DEVELOPER_IDENTITY: ${{ vars.CLASP_PUBLISHED_DEVELOPER_ID_APPLICATION_IDENTITY }}
          DEVELOPER_ID_CERTIFICATE_SHA256: ${{ vars.CLASP_PUBLISHED_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_VISIBILITY" == public ]] \
            || { echo "published acceptance requires a public repository" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "published release tag is invalid" >&2; exit 1; }
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] \
            || { echo "published release ID is invalid" >&2; exit 1; }
          [[ "$UPDATE_FEED_URL" == "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" ]] \
            || { echo "published update-feed URL is invalid" >&2; exit 1; }
          [[ -n "$SPARKLE_PUBLIC_KEY" ]] \
            || { echo "published Sparkle public key is missing" >&2; exit 1; }
          source trusted-source/script/lib/direct_signing.sh
          clasp_direct_is_valid_identity "$DEVELOPER_IDENTITY"
          clasp_direct_is_valid_sha256 "$DEVELOPER_ID_CERTIFICATE_SHA256"
          DEVELOPER_ID_CERTIFICATE_SHA256="$(clasp_direct_uppercase_sha256 \
            "$DEVELOPER_ID_CERTIFICATE_SHA256")"
          [[ "$EXPECTED_TAG_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "expected release source SHA is invalid" >&2; exit 1; }
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "trusted workflow SHA is invalid" >&2; exit 1; }
          [[ "$(git -C trusted-source rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]] \
            || { echo "trusted workflow checkout does not match its pinned SHA" >&2; exit 1; }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$TRIGGER_REF" == "refs/heads/$DEFAULT_BRANCH" ]] \
              || { echo "recovery acceptance must dispatch from the default branch" >&2; exit 1; }
            clasp_direct_is_valid_sha256 "$APPROVED_ARCHIVE_SHA256"
            APPROVED_ARCHIVE_SHA256="$(clasp_direct_uppercase_sha256 \
              "$APPROVED_ARCHIVE_SHA256")"
          else
            [[ -z "$APPROVED_ARCHIVE_SHA256" ]] \
              || { echo "automatic published acceptance must not receive a recovery hash" >&2; exit 1; }
          fi

          RELEASE_JSON="$RUNNER_TEMP/published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_JSON"
          [[ "$(jq -r '.id | tostring' "$RELEASE_JSON")" == "$RELEASE_ID" ]] \
            || { echo "live release ID does not match approval" >&2; exit 1; }
          [[ "$(jq -r .tag_name "$RELEASE_JSON")" == "$RELEASE_TAG" ]] \
            || { echo "live release tag does not match approval" >&2; exit 1; }
          [[ "$(jq -r .draft "$RELEASE_JSON")" == false ]] \
            || { echo "release must be public before acceptance" >&2; exit 1; }
          [[ "$(jq -r .prerelease "$RELEASE_JSON")" == false ]] \
            || { echo "published acceptance refuses prereleases" >&2; exit 1; }
          [[ "$(jq '.assets | length' "$RELEASE_JSON")" == 3 ]] \
            || { echo "published release must contain exactly three assets" >&2; exit 1; }

          ENCODED_DEFAULT_BRANCH="$(jq -rn --arg value "$DEFAULT_BRANCH" '$value | @uri')"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENCODED_DEFAULT_BRANCH" --jq '.protected')" == true ]] \
            || { echo "default branch is not protected" >&2; exit 1; }
          git -C trusted-source fetch --force --tags origin
          git -C trusted-source fetch origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          TAG_SHA="$(git -C trusted-source rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$TAG_SHA" == "$EXPECTED_TAG_SHA" ]] \
            || { echo "release tag source does not match approval" >&2; exit 1; }
          git -C trusted-source merge-base --is-ancestor \
            "$TAG_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          git -C trusted-source merge-base --is-ancestor \
            "$TRUSTED_WORKFLOW_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-output
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Clasp-*.zip' \
            --pattern 'Clasp-*.zip.sha256' \
            --pattern appcast.xml \
            --dir release-output
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' "$UPDATE_FEED_URL" \
            --output "$RUNNER_TEMP/public-appcast.xml"
          cmp -s release-output/appcast.xml "$RUNNER_TEMP/public-appcast.xml"

          if grep -E '<![[:space:]]*(DOCTYPE|ENTITY)' release-output/appcast.xml >/dev/null; then
            echo "published appcast contains a forbidden XML declaration" >&2
            exit 1
          fi
          BUILD_NUMBER_COUNT="$(xmllint --nonet --xpath \
            'string(count(/rss/channel/item[1]/*[local-name()="version" and namespace-uri()="http://www.andymatuschak.org/xml-namespaces/sparkle"]))' \
            release-output/appcast.xml)"
          [[ "$BUILD_NUMBER_COUNT" == 1 ]] \
            || { echo "published appcast must contain exactly one Sparkle build number" >&2; exit 1; }
          BUILD_NUMBER="$(xmllint --nonet --xpath \
            'string((/rss/channel/item[1]/*[local-name()="version" and namespace-uri()="http://www.andymatuschak.org/xml-namespaces/sparkle"])[1])' \
            release-output/appcast.xml)"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] \
            || { echo "published Sparkle build number is invalid" >&2; exit 1; }
          ARCHIVE="release-output/Clasp-$VERSION-$BUILD_NUMBER.zip"
          [[ -f "$ARCHIVE" && -f "$ARCHIVE.sha256" ]] \
            || { echo "published archive or checksum is missing" >&2; exit 1; }
          ARCHIVE_SHA256="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          ARCHIVE_NAME="${ARCHIVE##*/}"
          jq -e --arg archive "$ARCHIVE_NAME" \
            '([.assets[].name] | sort) == (["appcast.xml", $archive, ($archive + ".sha256")] | sort)' \
            "$RELEASE_JSON" >/dev/null
          [[ "$(jq -r --arg archive "$ARCHIVE_NAME" \
            '.assets[] | select(.name == $archive) | .digest' "$RELEASE_JSON")" == \
            "sha256:$ARCHIVE_SHA256" ]] \
            || { echo "GitHub archive digest does not match the downloaded release asset" >&2; exit 1; }
          if [[ -n "$APPROVED_ARCHIVE_SHA256" ]]; then
            [[ "$(clasp_direct_uppercase_sha256 "$ARCHIVE_SHA256")" == "$APPROVED_ARCHIVE_SHA256" ]] \
              || { echo "published archive does not match the approved recovery hash" >&2; exit 1; }
          fi
          PUBLIC_ARCHIVE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/${ARCHIVE##*/}"
          PUBLIC_CHECKSUM_URL="$PUBLIC_ARCHIVE_URL.sha256"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' "$PUBLIC_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/public-archive.zip"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' "$PUBLIC_CHECKSUM_URL" \
            --output "$RUNNER_TEMP/public-archive.zip.sha256"
          cmp -s "$ARCHIVE" "$RUNNER_TEMP/public-archive.zip"
          cmp -s "$ARCHIVE.sha256" "$RUNNER_TEMP/public-archive.zip.sha256"

          CLASP_DEVELOPER_ID_APPLICATION="$DEVELOPER_IDENTITY" \
          CLASP_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256="$DEVELOPER_ID_CERTIFICATE_SHA256" \
          CLASP_UPDATE_FEED_URL="$UPDATE_FEED_URL" \
          CLASP_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
          ./trusted-source/script/verify_direct_release.sh \
            release-output "$VERSION" "$BUILD_NUMBER" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --require-notarization --archive-only

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg release_id "$RELEASE_ID" \
            --arg acceptance_trigger "$GITHUB_EVENT_NAME" \
            --arg source_sha "$TAG_SHA" \
            --arg verifier_sha "$TRUSTED_WORKFLOW_SHA" \
            --arg developer_id_application_certificate_sha256 "$DEVELOPER_ID_CERTIFICATE_SHA256" \
            --arg public_archive_url "$PUBLIC_ARCHIVE_URL" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg appcast_sha256 "$(shasum -a 256 release-output/appcast.xml | awk '{print $1}')" \
            '{repository:$repository,tag:$tag,release_id:$release_id,acceptance_trigger:$acceptance_trigger,source_sha:$source_sha,verifier_sha:$verifier_sha,developer_id_application_certificate_sha256:$developer_id_application_certificate_sha256,public_archive_url:$public_archive_url,archive_sha256:$archive_sha256,appcast_sha256:$appcast_sha256}' \
            > published-release-acceptance.json
      - name: Preserve the public-release acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event.release.tag_name || inputs.release_tag }}-published-acceptance
          path: published-release-acceptance.json
          if-no-files-found: error
          retention-days: 90

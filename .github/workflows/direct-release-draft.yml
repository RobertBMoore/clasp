name: Direct release draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version (for example 1.0.0)
        required: true
      build_number:
        description: Strictly increasing integer build number
        required: true
permissions:
  contents: write
concurrency:
  # Preserve approved release requests instead of replacing an older pending
  # run when another request enters this protected serial group.
  group: clasp-direct-release
  cancel-in-progress: false
  queue: max
jobs:
  signed-notarized-draft:
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate inputs and repository configuration
        id: release_inputs
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_BUILD_NUMBER: ${{ inputs.build_number }}
          UPDATE_FEED_URL: ${{ vars.CLASP_UPDATE_FEED_URL }}
          PUBLIC_KEY: ${{ vars.CLASP_SPARKLE_PUBLIC_KEY }}
          DEVELOPER_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          DEVELOPER_ID_CERTIFICATE_SHA256: ${{ vars.DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_REF" == "refs/heads/$DEFAULT_BRANCH" ]] \
            || { echo "direct release must run from the default branch" >&2; exit 1; }
          [[ "$REF_PROTECTED" == true ]] \
            || { echo "direct release requires a protected ref" >&2; exit 1; }
          [[ "$REPOSITORY_VISIBILITY" == public ]] \
            || { echo "direct release requires a public repository" >&2; exit 1; }
          [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "direct release version is invalid" >&2; exit 1; }
          [[ "$RAW_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] \
            || { echo "direct release build number is invalid" >&2; exit 1; }
          [[ "$UPDATE_FEED_URL" == "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" ]] \
            || { echo "direct release update-feed URL is invalid" >&2; exit 1; }
          [[ -n "$PUBLIC_KEY" ]] \
            || { echo "Sparkle public key is missing" >&2; exit 1; }
          source script/lib/direct_signing.sh
          clasp_direct_is_valid_identity "$DEVELOPER_IDENTITY"
          clasp_direct_is_valid_sha256 "$DEVELOPER_ID_CERTIFICATE_SHA256"
          git fetch --force --tags origin
          [[ "$(git rev-list -n 1 "v$RAW_VERSION")" == "$(git rev-parse HEAD)" ]] \
            || { echo "direct release tag must resolve to the workflow source commit" >&2; exit 1; }

          LATEST_JSON="$RUNNER_TEMP/latest-release.json"
          LATEST_ERROR="$RUNNER_TEMP/latest-release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" >"$LATEST_JSON" 2>"$LATEST_ERROR"; then
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' "$UPDATE_FEED_URL" \
              --output "$RUNNER_TEMP/latest-appcast.xml"
            if grep -E '<![[:space:]]*(DOCTYPE|ENTITY)' "$RUNNER_TEMP/latest-appcast.xml" >/dev/null; then
              echo "latest appcast contains a forbidden XML declaration" >&2
              exit 1
            fi
            LATEST_BUILD_COUNT="$(xmllint --nonet --xpath \
              'string(count(/rss/channel/item[1]/*[local-name()="version" and namespace-uri()="http://www.andymatuschak.org/xml-namespaces/sparkle"]))' \
              "$RUNNER_TEMP/latest-appcast.xml")"
            [[ "$LATEST_BUILD_COUNT" == 1 ]] \
              || { echo "latest appcast must contain exactly one Sparkle build number" >&2; exit 1; }
            LATEST_BUILD="$(xmllint --nonet --xpath \
              'string((/rss/channel/item[1]/*[local-name()="version" and namespace-uri()="http://www.andymatuschak.org/xml-namespaces/sparkle"])[1])' \
              "$RUNNER_TEMP/latest-appcast.xml")"
            [[ "$LATEST_BUILD" =~ ^[1-9][0-9]{0,17}$ ]] \
              || { echo "latest published Sparkle build number is invalid" >&2; exit 1; }
            ((10#$RAW_BUILD_NUMBER > 10#$LATEST_BUILD)) \
              || { echo "direct release build must exceed the latest published build" >&2; exit 1; }
          else
            grep -F 'HTTP 404' "$LATEST_ERROR" >/dev/null || {
              cat "$LATEST_ERROR" >&2
              exit 1
            }
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length')" == 0 ]] \
              || { echo "latest release lookup failed while releases already exist" >&2; exit 1; }
          fi
          printf 'version=%s\n' "$RAW_VERSION" >> "$GITHUB_OUTPUT"
          printf 'build_number=%s\n' "$RAW_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Test the exact direct-download compilation boundary
        env:
          CLASP_DIRECT_DISTRIBUTION: "1"
        run: |
          set -euo pipefail
          source release/config.env
          source script/lib/direct_package_resolution.sh
          clasp_install_direct_package_resolution Package.resolved release/Package.direct.resolved
          cleanup_direct_resolution() {
            local status=$?
            trap - EXIT
            if ! clasp_remove_direct_package_resolution Package.resolved release/Package.direct.resolved; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_direct_resolution EXIT
          swift test \
            --scratch-path .build-direct-release-test \
            --configuration release \
            --arch "$CLASP_ARCH" \
            --force-resolved-versions \
            -Xswiftc -DCLASP_DIRECT_DISTRIBUTION
          clasp_verify_direct_package_resolution Package.resolved release/Package.direct.resolved
      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$P12_BASE64" && -n "$P12_PASSWORD" ]] \
            || { echo "Developer ID credential is missing" >&2; exit 1; }
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "CLASP_EPHEMERAL_KEYCHAIN=$RUNNER_TEMP/clasp.keychain-db" >> "$GITHUB_ENV"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/clasp.keychain-db" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/clasp.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/clasp.keychain-db"
      - name: Build, sign, and verify
        env:
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release_inputs.outputs.build_number }}
          CLASP_DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          CLASP_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256: ${{ vars.DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          CLASP_UPDATE_FEED_URL: ${{ vars.CLASP_UPDATE_FEED_URL }}
          CLASP_SPARKLE_PUBLIC_KEY: ${{ vars.CLASP_SPARKLE_PUBLIC_KEY }}
        run: ./script/package_direct_release.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"
      - name: Notarize and staple
        env:
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release_inputs.outputs.build_number }}
          NOTARY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          CLASP_NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          CLASP_NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$NOTARY_P8_BASE64" ]] \
            || { echo "Apple notarization API key is missing" >&2; exit 1; }
          [[ -n "$CLASP_NOTARY_KEY_ID" && -n "$CLASP_NOTARY_ISSUER_ID" ]] \
            || { echo "Apple notarization key metadata is missing" >&2; exit 1; }
          printf '%s' "$NOTARY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export CLASP_NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          ./script/notarize_direct_release.sh release-output/Clasp.app "release-output/Clasp-$RELEASE_VERSION-$RELEASE_BUILD_NUMBER.zip"
      - name: Generate signed appcast
        env:
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          CLASP_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CLASP_SPARKLE_PRIVATE_KEY" ]] \
            || { echo "Sparkle private key is missing" >&2; exit 1; }
          ./script/generate_appcast.sh release-output "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/"
      - name: Verify finished direct release offline
        env:
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release_inputs.outputs.build_number }}
          CLASP_DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          CLASP_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256: ${{ vars.DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          CLASP_UPDATE_FEED_URL: ${{ vars.CLASP_UPDATE_FEED_URL }}
          CLASP_SPARKLE_PUBLIC_KEY: ${{ vars.CLASP_SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ./script/verify_direct_release.sh release-output "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/" --require-notarization
      - name: Create draft GitHub release
        env:
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" release-output/Clasp-*.zip release-output/Clasp-*.zip.sha256 release-output/appcast.xml --draft --verify-tag --title "Clasp $RELEASE_VERSION" --generate-notes
          echo "Draft created. A human must review and publish it in GitHub."
      - name: Remove imported release credentials
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CLASP_EPHEMERAL_KEYCHAIN:-}" && -e "$CLASP_EPHEMERAL_KEYCHAIN" ]]; then
            security delete-keychain "$CLASP_EPHEMERAL_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
